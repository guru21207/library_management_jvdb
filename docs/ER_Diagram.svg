<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .header-bg { fill: #1e293b; }
      .table-card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .table-header-members { fill: #10b981; rx: 10; ry: 10; }
      .table-header-books { fill: #6366f1; rx: 10; ry: 10; }
      .table-header-borrow { fill: #f59e0b; rx: 10; ry: 10; }
      .title-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .subtitle-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
      .table-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .table-subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; fill: rgba(255,255,255,0.85); }
      .col-name { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .col-type { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; fill: #94a3b8; }
      .badge-pk { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 700; fill: #f59e0b; }
      .badge-fk { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 700; fill: #38bdf8; }
      .badge-null { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 600; fill: #a855f7; }
      .rel-line { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .rel-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #38bdf8; text-anchor: middle; }
      .rel-card { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; fill: #f8fafc; }
      .legend-box { fill: #182234; stroke: #334155; stroke-width: 1.5; rx: 8; ry: 8; }
      .legend-title { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .legend-text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; }
      .div-line { stroke: #334155; stroke-width: 1; }
      .row-alt { fill: #172033; }
    </style>
    <!-- Arrow Marker -->
    <marker id="crow" viewBox="0 0 20 20" refX="10" refY="10" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 10 L 0 20 M 10 0 L 20 10 L 10 20" stroke="#38bdf8" stroke-width="2" fill="none" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" class="bg" />

  <!-- Title Header Block -->
  <g transform="translate(60, 40)">
    <rect x="-10" y="-10" width="1080" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="30" class="title-text">BookNest • Entity-Relationship (ER) Schema Diagram</text>
    <text x="20" y="55" class="subtitle-text">Relational conceptual &amp; physical model for MySQL 8.0 • Layered Architecture (books, members, borrow_records)</text>
  </g>

  <!-- ======================================================== -->
  <!-- ENTITY 1: MEMBERS (Top Left)                             -->
  <!-- ======================================================== -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <!-- Card Container -->
    <rect width="320" height="230" class="table-card" />
    
    <!-- Table Header -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 310 0 C 315.5 0 320 4.5 320 10 L 320 54 L 0 54 Z" class="table-header-members" />
    <text x="18" y="28" class="table-title">👥 MEMBERS</text>
    <text x="18" y="46" class="table-subtitle">Patron master directory</text>

    <!-- Column Headers -->
    <rect x="0" y="54" width="320" height="26" fill="#182234" />
    <text x="18" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">KEY</text>
    <text x="60" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">FIELD</text>
    <text x="195" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">DATA TYPE</text>

    <!-- Field 1: member_id -->
    <rect x="0" y="80" width="320" height="34" class="row-alt" />
    <rect x="18" y="90" width="28" height="15" rx="3" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="23" y="102" class="badge-pk">PK</text>
    <text x="60" y="102" class="col-name">member_id</text>
    <text x="195" y="102" class="col-type">VARCHAR(20)</text>

    <!-- Divider -->
    <line x1="0" y1="114" x2="320" y2="114" class="div-line" />

    <!-- Field 2: name -->
    <rect x="0" y="114" width="320" height="34" fill="#1e293b" />
    <text x="60" y="136" class="col-name">name</text>
    <text x="195" y="136" class="col-type">VARCHAR(100)</text>

    <!-- Table Footer Meta -->
    <line x1="0" y1="160" x2="320" y2="160" class="div-line" />
    <text x="18" y="185" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Constraints: Primary Key (member_id)</text>
    <text x="18" y="205" font-family="'Segoe UI', sans-serif" font-size="11" fill="#10b981">● Rule: Max 3 active unreturned loans</text>
  </g>

  <!-- ======================================================== -->
  <!-- ENTITY 2: BOOKS (Bottom Left)                            -->
  <!-- ======================================================== -->
  <g transform="translate(60, 440)" filter="url(#shadow)">
    <!-- Card Container -->
    <rect width="320" height="340" class="table-card" />
    
    <!-- Table Header -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 310 0 C 315.5 0 320 4.5 320 10 L 320 54 L 0 54 Z" class="table-header-books" />
    <text x="18" y="28" class="table-title">📚 BOOKS</text>
    <text x="18" y="46" class="table-subtitle">Bibliographic catalog &amp; shelf stock</text>

    <!-- Column Headers -->
    <rect x="0" y="54" width="320" height="26" fill="#182234" />
    <text x="18" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">KEY</text>
    <text x="60" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">FIELD</text>
    <text x="195" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">DATA TYPE</text>

    <!-- Field 1: book_id -->
    <rect x="0" y="80" width="320" height="34" class="row-alt" />
    <rect x="18" y="90" width="28" height="15" rx="3" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="23" y="102" class="badge-pk">PK</text>
    <text x="60" y="102" class="col-name">book_id</text>
    <text x="195" y="102" class="col-type">VARCHAR(20)</text>

    <!-- Divider -->
    <line x1="0" y1="114" x2="320" y2="114" class="div-line" />

    <!-- Field 2: title -->
    <rect x="0" y="114" width="320" height="34" fill="#1e293b" />
    <text x="60" y="136" class="col-name">title</text>
    <text x="195" y="136" class="col-type">VARCHAR(150)</text>

    <!-- Divider -->
    <line x1="0" y1="148" x2="320" y2="148" class="div-line" />

    <!-- Field 3: author -->
    <rect x="0" y="148" width="320" height="34" class="row-alt" />
    <text x="60" y="170" class="col-name">author</text>
    <text x="195" y="170" class="col-type">VARCHAR(100)</text>

    <!-- Divider -->
    <line x1="0" y1="182" x2="320" y2="182" class="div-line" />

    <!-- Field 4: total_copies -->
    <rect x="0" y="182" width="320" height="34" fill="#1e293b" />
    <text x="60" y="204" class="col-name">total_copies</text>
    <text x="195" y="204" class="col-type">INT (>= 0)</text>

    <!-- Divider -->
    <line x1="0" y1="216" x2="320" y2="216" class="div-line" />

    <!-- Field 5: available_copies -->
    <rect x="0" y="216" width="320" height="34" class="row-alt" />
    <text x="60" y="238" class="col-name">available_copies</text>
    <text x="195" y="238" class="col-type">INT (&lt;= total)</text>

    <!-- Table Footer Meta -->
    <line x1="0" y1="250" x2="320" y2="250" class="div-line" />
    <text x="18" y="275" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">CHECK (total_copies &gt;= 0)</text>
    <text x="18" y="295" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">CHECK (available_copies &gt;= 0)</text>
    <text x="18" y="315" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6366f1">CHECK (available_copies &lt;= total_copies)</text>
  </g>

  <!-- ======================================================== -->
  <!-- ENTITY 3: BORROW_RECORDS (Associative Junction Entity)    -->
  <!-- ======================================================== -->
  <g transform="translate(680, 200)" filter="url(#shadow)">
    <!-- Card Container -->
    <rect width="460" height="480" class="table-card" />
    
    <!-- Table Header -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 450 0 C 455.5 0 460 4.5 460 10 L 460 54 L 0 54 Z" class="table-header-borrow" />
    <text x="18" y="28" class="table-title">🔄 BORROW_RECORDS</text>
    <text x="18" y="46" class="table-subtitle">Associative Transaction Entity (Circulation Audit Log)</text>

    <!-- Column Headers -->
    <rect x="0" y="54" width="460" height="26" fill="#182234" />
    <text x="18" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">KEY</text>
    <text x="60" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">FIELD</text>
    <text x="210" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">DATA TYPE</text>
    <text x="350" y="71" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#64748b">ATTRIBUTES</text>

    <!-- Field 1: record_id -->
    <rect x="0" y="80" width="460" height="34" class="row-alt" />
    <rect x="18" y="90" width="28" height="15" rx="3" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="23" y="102" class="badge-pk">PK</text>
    <text x="60" y="102" class="col-name">record_id</text>
    <text x="210" y="102" class="col-type">INT</text>
    <text x="350" y="102" class="col-type">AUTO_INCREMENT</text>

    <line x1="0" y1="114" x2="460" y2="114" class="div-line" />

    <!-- Field 2: member_id -->
    <rect x="0" y="114" width="460" height="34" fill="#1e293b" />
    <rect x="18" y="124" width="28" height="15" rx="3" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="23" y="136" class="badge-fk">FK</text>
    <text x="60" y="136" class="col-name">member_id</text>
    <text x="210" y="136" class="col-type">VARCHAR(20)</text>
    <text x="350" y="136" class="col-type">-> members.id</text>

    <line x1="0" y1="148" x2="460" y2="148" class="div-line" />

    <!-- Field 3: book_id -->
    <rect x="0" y="148" width="460" height="34" class="row-alt" />
    <rect x="18" y="158" width="28" height="15" rx="3" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="23" y="170" class="badge-fk">FK</text>
    <text x="60" y="170" class="col-name">book_id</text>
    <text x="210" y="170" class="col-type">VARCHAR(20)</text>
    <text x="350" y="170" class="col-type">-> books.id</text>

    <line x1="0" y1="182" x2="460" y2="182" class="div-line" />

    <!-- Field 4: issue_date -->
    <rect x="0" y="182" width="460" height="34" fill="#1e293b" />
    <text x="60" y="204" class="col-name">issue_date</text>
    <text x="210" y="204" class="col-type">DATE</text>
    <text x="350" y="204" class="col-type">NOT NULL</text>

    <line x1="0" y1="216" x2="460" y2="216" class="div-line" />

    <!-- Field 5: return_date -->
    <rect x="0" y="216" width="460" height="34" class="row-alt" />
    <rect x="18" y="226" width="34" height="15" rx="3" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1" />
    <text x="21" y="238" class="badge-null">NULL</text>
    <text x="60" y="238" class="col-name">return_date</text>
    <text x="210" y="238" class="col-type">DATE</text>
    <text x="350" y="238" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f59e0b">NULL = Active Loan</text>

    <line x1="0" y1="250" x2="460" y2="250" class="div-line" />

    <!-- Field 6: days_kept -->
    <rect x="0" y="250" width="460" height="34" fill="#1e293b" />
    <text x="60" y="272" class="col-name">days_kept</text>
    <text x="210" y="272" class="col-type">INT</text>
    <text x="350" y="272" class="col-type">DEFAULT 0, &gt;= 0</text>

    <line x1="0" y1="284" x2="460" y2="284" class="div-line" />

    <!-- Field 7: fine -->
    <rect x="0" y="284" width="460" height="34" class="row-alt" />
    <text x="60" y="306" class="col-name">fine</text>
    <text x="210" y="306" class="col-type">DECIMAL(10,2)</text>
    <text x="350" y="306" class="col-type">DEFAULT 0.00, &gt;= 0</text>

    <!-- Table Footer Meta -->
    <line x1="0" y1="324" x2="460" y2="324" class="div-line" />
    <text x="18" y="352" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Foreign Keys: fk_borrow_member, fk_borrow_book</text>
    <text x="18" y="374" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f59e0b">● Circulation Policy: 7 Days Free, ₹2.00/day fine after day 7</text>
    <text x="18" y="396" font-family="'Segoe UI', sans-serif" font-size="11" fill="#38bdf8">● Formula: fine = max(0, days_kept - 7) * 2.0</text>
    <text x="18" y="418" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">● Concurrency Control: SELECT ... FOR UPDATE with ACID Rollback</text>
  </g>

  <!-- ======================================================== -->
  <!-- RELATIONSHIP CONNECTORS & CARDINALITIES                   -->
  <!-- ======================================================== -->

  <!-- Relationship 1: MEMBERS (1) to BORROW_RECORDS (0..*) -->
  <g>
    <!-- Path from MEMBERS right (x=380, y=275) to BORROW_RECORDS left (x=680, y=330) -->
    <path d="M 380 275 L 530 275 L 530 330 L 680 330" class="rel-line" stroke="#10b981" stroke-width="2.5" />
    
    <!-- 1 (One) indicator on MEMBERS side -->
    <line x1="395" y1="265" x2="395" y2="285" stroke="#10b981" stroke-width="2.5" />
    <line x1="403" y1="265" x2="403" y2="285" stroke="#10b981" stroke-width="2.5" />
    <text x="390" y="255" class="rel-card">1</text>

    <!-- 0..* (Zero or Many) crow's foot on BORROW_RECORDS side -->
    <!-- Circle for optional (0) -->
    <circle cx="650" cy="330" r="5" stroke="#10b981" stroke-width="2" fill="#0f172a" />
    <!-- Crow's foot branches -->
    <line x1="680" y1="330" x2="665" y2="318" stroke="#10b981" stroke-width="2.5" />
    <line x1="680" y1="330" x2="665" y2="342" stroke="#10b981" stroke-width="2.5" />
    <text x="645" y="312" class="rel-card">0..*</text>

    <!-- Relationship Label Badge -->
    <rect x="470" y="290" width="120" height="24" rx="4" fill="#182234" stroke="#10b981" stroke-width="1.2" />
    <text x="530" y="306" class="rel-label" fill="#10b981">places / borrows</text>
  </g>

  <!-- Relationship 2: BOOKS (1) to BORROW_RECORDS (0..*) -->
  <g>
    <!-- Path from BOOKS right (x=380, y=560) to BORROW_RECORDS left (x=680, y=410) -->
    <path d="M 380 560 L 530 560 L 530 410 L 680 410" class="rel-line" stroke="#6366f1" stroke-width="2.5" />
    
    <!-- 1 (One) indicator on BOOKS side -->
    <line x1="395" y1="550" x2="395" y2="570" stroke="#6366f1" stroke-width="2.5" />
    <line x1="403" y1="550" x2="403" y2="570" stroke="#6366f1" stroke-width="2.5" />
    <text x="390" y="540" class="rel-card">1</text>

    <!-- 0..* (Zero or Many) crow's foot on BORROW_RECORDS side -->
    <!-- Circle for optional (0) -->
    <circle cx="650" cy="410" r="5" stroke="#6366f1" stroke-width="2" fill="#0f172a" />
    <!-- Crow's foot branches -->
    <line x1="680" y1="410" x2="665" y2="398" stroke="#6366f1" stroke-width="2.5" />
    <line x1="680" y1="410" x2="665" y2="422" stroke="#6366f1" stroke-width="2.5" />
    <text x="645" y="392" class="rel-card">0..*</text>

    <!-- Relationship Label Badge -->
    <rect x="470" y="475" width="120" height="24" rx="4" fill="#182234" stroke="#6366f1" stroke-width="1.2" />
    <text x="530" y="491" class="rel-label" fill="#818cf8">circulates in</text>
  </g>

  <!-- ======================================================== -->
  <!-- NOTATION & CARDINALITY LEGEND (Bottom Right)              -->
  <!-- ======================================================== -->
  <g transform="translate(680, 705)">
    <rect width="460" height="75" class="legend-box" />
    <text x="18" y="24" class="legend-title">📖 Notation &amp; Cardinality Legend (Crow's Foot)</text>
    <text x="18" y="45" class="legend-text">|| = Exactly One (Mandatory) &nbsp;|&nbsp; o{ = Zero or Many (Optional Many)</text>
    <text x="18" y="63" class="legend-text">[PK] Primary Key &nbsp;|&nbsp; [FK] Foreign Key &nbsp;|&nbsp; [NULL] Nullable when loan active</text>
  </g>
</svg>
